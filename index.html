<meta charset="UTF-8">

<style>
:root {
  --paper-bg: #f4efe4;
  --paper: #fffdf8;
  --paper-deep: #eee7d8;
  --green: #71866a;
  --green-dark: #405743;
  --green-soft: #e7ecdf;
  --orange: #d99561;
  --orange-soft: #f5e5d4;
  --ink: #39443b;
  --muted: #7b8176;
  --line: #e5dfd2;
  --shadow: 0 16px 42px rgba(69, 76, 57, .09);
}

* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  position: relative;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  color: var(--ink);
  background-color: var(--paper-bg);
  background-image:
    radial-gradient(rgba(104, 121, 91, .12) .8px, transparent .8px),
    linear-gradient(135deg, rgba(255,255,255,.36), transparent 52%);
  background-size: 26px 26px, auto;
  font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

button { font: inherit; cursor: pointer; border: 0; }
button:focus-visible, a:focus-visible {
  outline: 3px solid rgba(217, 149, 97, .55);
  outline-offset: 3px;
}

.site-header {
  position: relative;
  z-index: 1;
  padding: 38px 18px 20px;
  text-align: center;
}

.brand-stamp {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border: 1px solid #cbd3c1;
  border-radius: 999px;
  color: var(--green-dark);
  background: rgba(255,253,248,.7);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .16em;
}

.brand-stamp::before, .brand-stamp::after {
  content: "✳";
  color: var(--orange);
  font-size: 12px;
}

h1 {
  margin: 13px 0 7px;
  color: var(--green-dark);
  font-family: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", serif;
  font-size: clamp(29px, 6vw, 42px);
  font-weight: 800;
  letter-spacing: .06em;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  letter-spacing: .04em;
  line-height: 1.7;
}

.header-flourish {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin: 15px auto 0;
  color: #9aa68b;
  font-size: 12px;
}

.header-flourish span {
  width: 46px;
  height: 1px;
  background: #b9c2ad;
}

main {
  position: relative;
  z-index: 1;
  width: min(100% - 30px, 820px);
  margin: 0 auto 42px;
}

.panel {
  position: relative;
  overflow: hidden;
  padding: clamp(17px, 4vw, 30px);
  border: 1px solid rgba(205, 198, 181, .85);
  border-radius: 30px 26px 29px 24px;
  background: rgba(255,253,248,.94);
  box-shadow: var(--shadow);
}

.panel::before, .panel::after {
  position: absolute;
  z-index: 0;
  width: 38px;
  height: 38px;
  border-color: #c5cfb9;
  border-style: solid;
  content: "";
  opacity: .8;
  pointer-events: none;
}
.panel::before {
  top: 12px;
  left: 12px;
  border-width: 1px 0 0 1px;
  border-radius: 12px 0 0;
}
.panel::after {
  right: 12px;
  bottom: 12px;
  border-width: 0 1px 1px 0;
  border-radius: 0 0 12px;
}

.panel-heading {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin: 2px 4px 4px;
}

.section-kicker {
  margin-bottom: 5px;
  color: var(--orange);
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .2em;
}

h2 {
  margin: 0 0 6px;
  color: var(--green-dark);
  font-family: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", serif;
  font-size: 21px;
  letter-spacing: .04em;
}

.hint {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.count-badge {
  flex: 0 0 auto;
  margin-top: 5px;
  padding: 7px 11px;
  border: 1px dashed #bdc8b2;
  border-radius: 7px 12px 8px 11px;
  color: var(--green-dark);
  background: #f2f5ec;
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
}

.wheel-wrap {
  position: relative;
  width: min(78vw, 430px);
  margin: 24px auto 20px;
  aspect-ratio: 1;
}

.wheel {
  display: block;
  width: 100%;
  height: 100%;
  border: 8px solid var(--paper);
  border-radius: 50%;
  background: var(--paper);
  box-shadow: 0 7px 22px rgba(61, 73, 54, .18), 0 0 0 1px #e9e3d7;
  transition: transform 1.85s cubic-bezier(.12,.72,.12,1);
}

.pointer {
  position: absolute;
  z-index: 2;
  top: -8px;
  left: 50%;
  width: 0;
  height: 0;
  transform: translateX(-50%);
  border-top: 30px solid var(--orange);
  border-right: 15px solid transparent;
  border-left: 15px solid transparent;
  filter: drop-shadow(0 2px 1px rgba(75, 65, 48, .18));
}

.wheel-center {
  position: absolute;
  top: 50%;
  left: 50%;
  display: grid;
  width: 78px;
  height: 78px;
  transform: translate(-50%,-50%);
  place-items: center;
  border: 5px solid #fff;
  border-radius: 50%;
  background: #fbf8ee;
  box-shadow: 0 2px 10px rgba(0,0,0,.13);
  color: var(--green-dark);
  font-size: 25px;
}

.wheel-caption {
  margin-top: -7px;
  color: #92988a;
  font-size: 11px;
  letter-spacing: .1em;
  text-align: center;
}

.actions {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 19px 0 4px;
}

.primary {
  min-width: 190px;
  padding: 14px 27px;
  border: 2px solid #fff9ed;
  border-radius: 999px;
  color: #fffdf8;
  background: var(--green);
  box-shadow: 0 5px 0 #52694e, 0 8px 16px rgba(69, 92, 62, .16);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .08em;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.primary:hover:not(:disabled) {
  transform: translateY(-2px);
  background: #607958;
  box-shadow: 0 7px 0 #52694e, 0 11px 19px rgba(69, 92, 62, .18);
}
.primary:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #52694e;
}

.secondary {
  padding: 12px 17px;
  border: 1px solid #dbe1d4;
  border-radius: 999px;
  color: var(--green-dark);
  background: #f0f3eb;
  font-size: 13px;
  font-weight: 700;
  transition: background .15s ease, transform .15s ease;
}
.secondary:hover:not(:disabled) {
  transform: translateY(-1px);
  background: #e6ecdf;
}

.primary:disabled, .secondary:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.result {
  display: none;
  margin-top: 23px;
  padding: 20px;
  border: 1px dashed #c6cfba;
  border-radius: 17px 22px 17px 22px;
  background: #f3f5ed;
  text-align: center;
}
.result.show { display: block; animation: result-in .35s ease-out both; }
@keyframes result-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-title {
  color: #879477;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: .16em;
}

.result-name {
  margin: 8px 0 13px;
  color: var(--green-dark);
  font-family: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", serif;
  font-size: clamp(22px, 5vw, 29px);
  font-weight: 850;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.result-meta {
  max-width: 540px;
  margin: 0 auto;
  padding: 13px 15px;
  border-radius: 12px;
  background: rgba(255,253,248,.82);
  color: #596354;
  font-size: 13px;
  line-height: 1.9;
  text-align: left;
  overflow-wrap: anywhere;
}

.result-meta:empty { display: none; }

.maplink {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 15px;
  padding: 11px 19px;
  border-radius: 999px;
  color: #fff;
  background: var(--orange);
  text-decoration: none;
  font-size: 13px;
  font-weight: 800;
  transition: background .15s ease, transform .15s ease;
}
.maplink:hover { transform: translateY(-1px); background: #ca8050; }

.tiny {
  margin-top: 18px;
  color: #96998e;
  font-size: 11px;
  text-align: center;
}

.confetti {
  position: fixed;
  z-index: 10;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.confetti i {
  position: absolute;
  top: -20px;
  width: 9px;
  height: 15px;
  animation: fall 3s linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); opacity: .2; }
}

.doodle {
  position: fixed;
  z-index: 0;
  width: 150px;
  color: #83947a;
  opacity: .28;
  pointer-events: none;
}
.doodle svg { display: block; width: 100%; height: auto; }
.doodle-left { top: 145px; left: 2.2%; transform: rotate(-9deg); }
.doodle-right { right: 2.5%; bottom: 90px; width: 165px; transform: rotate(7deg); }

footer {
  position: relative;
  z-index: 1;
  max-width: 780px;
  margin: 0 auto;
  padding: 0 18px 28px;
  color: #92968a;
  font-size: 11px;
  line-height: 1.7;
  text-align: center;
}

@media (max-width: 700px) {
  .doodle { width: 100px; opacity: .16; }
  .doodle-left { top: 155px; left: -20px; }
  .doodle-right { right: -25px; bottom: 65px; width: 115px; }
}

@media (max-width: 520px) {
  .site-header { padding: 28px 14px 16px; }
  main { width: min(100% - 20px, 820px); }
  .panel { padding: 17px 13px 19px; border-radius: 23px; }
  .panel-heading { align-items: flex-start; margin-right: 2px; margin-left: 2px; }
  h2 { font-size: 18px; }
  .hint { max-width: 250px; font-size: 12px; }
  .count-badge { padding: 6px 8px; font-size: 10px; }
  .wheel-wrap { width: min(84vw, 370px); margin-top: 22px; }
  .wheel { border-width: 6px; }
  .wheel-center { width: 66px; height: 66px; font-size: 22px; }
  .actions { gap: 9px; }
  .primary { width: min(100%, 280px); }
  .secondary { padding: 11px 14px; font-size: 12px; }
  .result { padding: 17px 13px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

// =====================================
// 3. 繪製轉盤
// =====================================

function drawWheel(canvas, items) {

  const ctx = canvas.getContext("2d");
  const n = items.length;

  const cx = 350;
  const cy = 350;
  const r = 340;

  ctx.clearRect(0,0,700,700);

  if (!n) {
    ctx.fillStyle = "#e8eee2";
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#40533e";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("準備抽選",cx,cy);
    return;
  }

  const colors = [
    "#dce8d4","#f7dfc8","#e9e8d7",
    "#f0d8d0","#d7e4df","#f4e8bd",
    "#e6dfef","#f1e2d3","#dce4c3",
    "#f5d9b8","#d9e8e8","#eadfe0"
  ];

  for (let i=0;i<n;i++) {

    const a = -Math.PI/2 + i*2*Math.PI/n;
    const b = a + 2*Math.PI/n;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,a,b);
    ctx.closePath();

    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();

    ctx.strokeStyle = "#fffdf7";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(a+Math.PI/n);

    let size = Math.min(
      25,
      Math.max(12,(2*Math.PI*r/n)*0.18)
    );

    ctx.font = `bold ${size}px sans-serif`;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#43523f";

    let label = typeof items[i] === "string" ? items[i] : getWheelLabel(items[i]);
    const maxWidth = r-90;

    while (
      size>12 &&
      ctx.measureText(label).width>maxWidth
    ) {
      size--;
      ctx.font = `bold ${size}px sans-serif`;
    }

    if (ctx.measureText(label).width>maxWidth) {
      while (
        label.length>1 &&
        ctx.measureText(label+"…").width>maxWidth
      ) {
        label = label.slice(0,-1);
      }
      label += "…";
    }

    ctx.fillText(label,r-24,0);
    ctx.restore();
  }
}


// =====================================
// 4. 音效（已調大音量）
// =====================================

function getAudio() {

  if (!soundEnabled) return null;

  try {
    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AC) return null;

    if (!audioContext) {
      audioContext = new AC();
    }

    if (audioContext.state==="suspended") {
      audioContext.resume();
    }

    return audioContext;

  } catch {
    return null;
  }
}


function tone(
  freq=440,
  duration=.07,
  volume=.25
) {

  const ctx = getAudio();
  if (!ctx) return;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.frequency.value = freq;
  osc.type = "triangle";

  gain.gain.setValueAtTime(
    .0001,
    ctx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    ctx.currentTime+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ctx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime+duration+.02);
}


function startSound() {

  if (!soundEnabled) return;

  let count = 0;

  tone(520,.055,.25);

  tickTimer = setInterval(() => {

    count++;

    tone(
      360+Math.min(count,12)*24,
      .045,
      .22
    );

  },105);
}


function stopSound() {

  if (tickTimer) {
    clearInterval(tickTimer);
    tickTimer = null;
  }

  tone(660,.12,.35);
  tone(880,.20,.32);
}


// =====================================
// 5. 隨機旋轉
// =====================================

function spin(canvas,items) {

  return new Promise(resolve => {

    if (!items.length) {
      resolve(null);
      return;
    }

    const index = Math.floor(
      Math.random()*items.length
    );

    const slice = 360/items.length;

    const current = Number(
      canvas.dataset.rotation || 0
    );

    const currentMod =
      ((current%360)+360)%360;

    const targetMod =
      (360-(index+.5)*slice)%360;

    const delta =
      ((targetMod-currentMod)+360)%360;

    const total =
      current+360*5+delta;

    canvas.style.transitionDuration =
      SPIN_MS+"ms";

    canvas.style.transform =
      `rotate(${total}deg)`;

    canvas.dataset.rotation = String(total);

    startSound();

    setTimeout(() => {
      stopSound();
      resolve(items[index]);
    },SPIN_MS);

  });
}


// =====================================
// 6. 顯示抽選結果

function showResult(r) {

  $("restaurantName").textContent = r.name;

  const info = [];

  if (r.category) {
    info.push("料理類別："+r.category);
  }

  if (r.price) {
    info.push("人均消費："+r.price);
  }

  if (r.address) {
    info.push("餐廳地址："+r.address);
  }

  if (r.feature) {
    info.push("餐廳特色："+r.feature);
  }

  $("restaurantInfo").innerHTML =
    info.map(x => escapeHTML(x)).join("<br>");

  $("mapLink").href =
    "https://www.google.com/maps/search/?api=1&query="+
    encodeURIComponent(r.address || r.name);

  $("restaurantResult").classList.add("show");

  confetti();

  tone(784,.16,.35);
  tone(988,.22,.35);
  tone(1175,.30,.32);
}


function escapeHTML(str) {

  return String(str).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[c]
  );

}


// =====================================
// 7. 抽餐廳（唯一的抽選方式）
// =====================================

async function restaurantSpin() {

  if (spinning) return;

  if (!RESTAURANTS.length) {
    alert("目前沒有可抽選的餐廳。");
    return;
  }

  spinning = true;
  updateButtons();

  clearResults();

  $("restaurantHint").textContent =
    "轉盤轉動中，看看今天吃哪一家……";

  $("restaurantHeading").scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

  const picked = await spin(
    $("restaurantWheel"),
    RESTAURANTS
  );

  if (picked) {
    showResult(picked);

    $("restaurantHint").textContent =
      "已從全部餐廳中抽出結果！";
  }

  spinning = false;
  updateButtons();
}


// =====================================
// 8. 清除結果及重新抽選
// =====================================

function clearResults() {
  $("restaurantResult").classList.remove("show");
  $("restaurantName").textContent = "";
  $("restaurantInfo").textContent = "";
}

// 點擊「重新抽新餐廳」：轉盤歸零後直接重新抽一家
function resetAndRespin() {
  if (spinning) return;

  clearResults();

  const wheel = $("restaurantWheel");
  wheel.style.transitionDuration = "0ms";
  wheel.style.transform = "rotate(0deg)";
  wheel.dataset.rotation = "0";

  // 強制瀏覽器套用歸零，再開始新的旋轉
  void wheel.offsetWidth;

  restaurantSpin();
}


// =====================================
// 9. 按鈕操作
// =====================================

function updateButtons() {
  $("spinButton").disabled = spinning;
  $("resetButton").disabled = spinning;
}

$("spinButton").onclick = restaurantSpin;

$("resetButton").onclick = resetAndRespin;

$("soundToggle").onclick = () => {
  soundEnabled = !soundEnabled;
  $("soundToggle").textContent = `${soundEnabled ? "♫　音效：開啟" : "♫　音效：關閉"}`;
  $("soundToggle").setAttribute("aria-pressed", String(soundEnabled));

  if (!soundEnabled && tickTimer) {
    clearInterval(tickTimer);
    tickTimer = null;
  }

  if (soundEnabled) getAudio();
};


// =====================================
// 10. 抽選完成紙花動畫
// =====================================

function confetti() {

  const root = $("confetti");

  root.innerHTML = "";

  const colors = [
    "#d4af37",
    "#f7e7a1",
    "#fff4cf",
    "#c99b45",
    "#b8893d",
    "#f4d6a0"
  ];

  for (let i=0;i<190;i++) {

    const el = document.createElement("i");

    const ribbon = Math.random()>.38;

    el.style.left =
      Math.random()*100+"%";

    el.style.width =
      (7+Math.random()*8)+"px";

    el.style.height =
      ribbon
        ? (20+Math.random()*30)+"px"
        : (7+Math.random()*10)+"px";

    el.style.borderRadius =
      ribbon?"3px":"50%";

    el.style.background =
      colors[i%colors.length];

    el.style.animationDuration =
      (2.8+Math.random()*2)+"s";

    el.style.animationDelay =
      Math.random()+ "s";

    root.appendChild(el);
  }

  setTimeout(()=>{
    root.innerHTML="";
  },5500);

}

  drawWheel(

  $("restaurantCount").textContent =

}
